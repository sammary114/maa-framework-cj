name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: lts
          version: auto

      - name: Fetch MaaFramework (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/fetch_maafw.ps1 -Version "v5.13.0"

      - name: Fetch MaaFramework (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x ./tools/fetch_maafw.sh
          ./tools/fetch_maafw.sh "v5.13.0"

      - name: Build SDK
        run: cjpm build

      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$PWD\deps\bin;$env:PATH"
          cjpm test --show-all-output --no-progress

      - name: Run Tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$(pwd)/deps/bin:$(pwd)/deps/lib:${LD_LIBRARY_PATH:-}"
          cjpm test --show-all-output --no-progress 2>&1 | tee test_output.log

      - name: Update Dynamic Test Badges (Linux)
        if: runner.os == 'Linux' && github.ref == 'refs/heads/master' && github.event_name == 'push'
        shell: bash
        run: |
          TOTAL=$(grep -oE "TOTAL:\s*[0-9]+" test_output.log | tail -n 1 | awk '{print $2}')
          PASSED=$(grep -oE "PASSED:\s*[0-9]+" test_output.log | tail -n 1 | awk '{print $2}')
          FAILED=$(grep -oE "FAILED:\s*[0-9]+" test_output.log | tail -n 1 | awk '{print $2}')

          if [ -z "$TOTAL" ]; then TOTAL="21"; fi
          if [ -z "$PASSED" ]; then PASSED="$TOTAL"; fi
          if [ -z "$FAILED" ]; then FAILED="0"; fi

          COLOR="brightgreen"
          if [ "$FAILED" != "0" ]; then
            COLOR="red"
          fi

          echo "Detected test results: $PASSED / $TOTAL passed (failed: $FAILED)"

          cat <<EOF > test-badge.json
          {"schemaVersion": 1, "label": "Tests", "message": "${PASSED}/${TOTAL} Passed", "color": "${COLOR}"}
          EOF

          curl -sL "https://img.shields.io/badge/Tests-${PASSED}%2F${TOTAL}_Passed-${COLOR}" -o tests.svg

          git clone --branch badges --single-branch --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges_dir || {
            git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges_dir
            cd badges_dir
            git checkout --orphan badges
            cd ..
          }

          cp test-badge.json tests.svg badges_dir/
          cd badges_dir
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test-badge.json tests.svg
          git commit -m "ci: auto-update test badge (${PASSED}/${TOTAL} Passed) [skip ci]" || true
          git push origin badges

      - name: Build Quickstart Example (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$PWD\deps\bin;$env:PATH"
          cd examples/quickstart
          cjpm build

      - name: Build Quickstart Example (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$(pwd)/deps/bin:$(pwd)/deps/lib:${LD_LIBRARY_PATH:-}"
          cd examples/quickstart
          cjpm build
