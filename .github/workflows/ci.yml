name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: lts
          version: auto

      - name: Fetch MaaFramework (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/fetch_maafw.ps1 -Version "v5.13.0"

      - name: Fetch MaaFramework (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x ./tools/fetch_maafw.sh
          ./tools/fetch_maafw.sh "v5.13.0"

      - name: Build SDK
        run: cjpm build

      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$PWD\deps\bin;$env:PATH"
          cjpm test --show-all-output --no-progress

      - name: Run Tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$(pwd)/deps/bin:$(pwd)/deps/lib:${LD_LIBRARY_PATH:-}"
          cjpm test --show-all-output --no-progress

      - name: Build Quickstart Example (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$PWD\deps\bin;$env:PATH"
          cd examples/quickstart
          cjpm build

      - name: Build Quickstart Example (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$(pwd)/deps/bin:$(pwd)/deps/lib:${LD_LIBRARY_PATH:-}"
          cd examples/quickstart
          cjpm build
