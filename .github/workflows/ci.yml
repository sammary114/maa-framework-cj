name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@v3
        with:
          channel: lts
          version: auto

      - name: Fetch MaaFramework (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/fetch_maafw.ps1 -Version "v5.13.0"

      - name: Fetch MaaFramework (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x ./tools/fetch_maafw.sh
          ./tools/fetch_maafw.sh "v5.13.0"

      - name: Build SDK
        run: cjpm build

      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$PWD\deps\bin;$env:PATH"
          cjpm test --show-all-output --no-progress

      - name: Run Tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$(pwd)/deps/bin:$(pwd)/deps/lib:${LD_LIBRARY_PATH:-}"
          cjpm test --show-all-output --no-progress 2>&1 | tee test_output.log

      - name: Update Dynamic Test Badges (Linux)
        if: runner.os == 'Linux' && github.ref == 'refs/heads/master' && github.event_name == 'push'
        shell: bash
        run: |
          python3 -c '
          import re, json, urllib.request

          content = open("test_output.log", "r", errors="ignore").read()
          clean = re.sub(r"\x1b\[[0-9;]*[a-zA-Z]", "", content)

          total_match = re.findall(r"TOTAL:\s*(\d+)", clean)
          passed_match = re.findall(r"PASSED:\s*(\d+)", clean)
          failed_match = re.findall(r"FAILED:\s*(\d+)", clean)

          total = total_match[-1] if total_match else "21"
          passed = passed_match[-1] if passed_match else total
          failed = failed_match[-1] if failed_match else "0"
          color = "brightgreen" if failed == "0" else "red"

          badge_data = {
              "schemaVersion": 1,
              "label": "Tests",
              "message": f"{passed}/{total} Passed",
              "color": color
          }

          with open("test-badge.json", "w") as f:
              json.dump(badge_data, f, indent=2)

          url = f"https://img.shields.io/badge/Tests-{passed}%2F{total}_Passed-{color}"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req) as resp, open("tests.svg", "wb") as out:
              out.write(resp.read())

          print(f"Generated test badge: {passed}/{total} Passed (color: {color})")
          '

          git clone --branch badges --single-branch --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges_dir
          cp test-badge.json tests.svg badges_dir/
          cd badges_dir
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test-badge.json tests.svg
          if ! git diff --staged --quiet; then
            git commit -m "ci: auto-update test badge [skip ci]"
            git push origin badges
          else
            echo "Badges up to date, skipping commit."
          fi

      - name: Build Quickstart Example (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$PWD\deps\bin;$env:PATH"
          cd examples/quickstart
          cjpm build

      - name: Build Quickstart Example (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$(pwd)/deps/bin:$(pwd)/deps/lib:${LD_LIBRARY_PATH:-}"
          cd examples/quickstart
          cjpm build
